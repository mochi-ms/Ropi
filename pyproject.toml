[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ropi"
version = "0.1.0"
description = "Roblox Virtual Piano auto-player, song library, overlay with lyrics, and YouTube-to-MIDI converter"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.8,<7",
    "mido>=1.3",
    "pretty_midi>=0.2.10",
    "pydantic>=2.7",
    "yt-dlp>=2025.1.1",
    "numpy>=1.26,<3",
    "soundfile>=0.12",
]

[project.scripts]
ropi = "ropi.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "gui: tests requiring Qt GUI / pytest-qt",
    "integration: integration tests",
    "slow: slow benchmark or fuzz tests",
]

[tool.coverage.run]
source = ["src/ropi"]
omit = ["src/ropi/tools/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # handled by formatter / Korean strings
    "RUF001", # ambiguous unicode chars in Korean UI / musical symbols
    "RUF002",
    "RUF003",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "Windows"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
extraPaths = ["src"]
reportMissingModuleSource = "none"
